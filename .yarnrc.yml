approvedGitRepositories:
  - "**"

compressionLevel: mixed

# Use the machine-wide cache instead of committing hundreds of zips to the repo.
enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

# Keep each workspace's dependencies under its own node_modules. Hoisting to the
# root left workspaces/client with a second ESLint copy that was missing its own ajv.
nmHoistingLimits: workspaces

npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.18.1.cjs
